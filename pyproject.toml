[project]
name = "test-accounting"
version = "0.1.0"
description = "REST API application to store user payments and listening payment system webhooks"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bcrypt>=5.0.0",
    "psycopg2>=2.9.11",
    "pyjwt>=2.11.0",
    "sanic>=25.12.0",
    "sqlalchemy>=2.0.46",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
env_override_existing_values = 1
env_files = [
    "src/.env"
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-dotenv>=0.5.2",
    "sanic-testing>=24.6.0",
    "tenacity>=9.1.4",
]
