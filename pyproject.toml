[build-system]
requires = ["uv_build >= 0.10.0, <0.11.0"]
build-backend = "uv_build"

[project]
name = "accounts"
authors = [
    {name = "Vladimir Krokhin", email = "krokhinvladimir2004@gmail.com"}
]
version = "0.1.0"
license = "GPL-3.0-or-later"
description = "REST API application to store user payments and listening payment system webhooks"
readme = "README.md"
requires-python = ">=3.14"
classifiers = [
    "Framework :: Sanic",
    "Programming Language :: Python :: 3"
]
dependencies = [
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "pyjwt>=2.11.0",
    "python-dotenv>=1.2.1",
    "sanic>=25.12.0",
    "sqlalchemy[asyncio]>=2.0.46",
]

[project.scripts]
start-app = "accounts.main:start_app"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::jwt.InsecureKeyLengthWarning"
]
env_override_existing_values = 1
env_files = [
    "src/.env"
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv]
package = true
compile-bytecode = true

[tool.uv.build-backend]
source-include = ["tests/**"]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-dotenv>=0.5.2",
    "pytest-timeout>=2.4.0",
    "sanic-testing>=24.6.0",
    "tenacity>=9.1.4",
]
